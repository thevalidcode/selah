[package]
name = "selah"
version = "0.1.0"
description = "Selah — offline-first church service presentation application"
authors = ["Selah"]
edition = "2021"
rust-version = "1.77"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "selah_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` serves media files (images/video/audio) to the webview
# through the `asset:` URI scheme. Which folders are readable is granted at
# runtime (see `media::MediaAccess`), so no path is hardcoded anywhere.
tauri = { version = "2", features = [ "tray-icon", "protocol-asset" ] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
cpal = "0.18"
chrono = { version = "0.4", features = ["clock"] }

# Moonshine speech-to-text, run directly on ONNX Runtime.
#
# Why not a wrapper crate: the widely used wrappers (transcribe-rs,
# sherpa-onnx) load Moonshine through a *merged* decoder graph that expects a
# `use_cache_branch` input. The models distributed by Transformers.js /
# optimum — which is what Selah ships — are the *split* export
# (`encoder_model`, `decoder_model`, `decoder_with_past_model`, none of which
# contain `use_cache_branch`). Those graphs cannot be renamed into the merged
# layout, so Selah drives ONNX Runtime itself and speaks both layouts.
#
# `load-dynamic` means ONNX Runtime is not downloaded at build time; the
# shared library is resolved at start-up (see `speech::moonshine::runtime`).
ort = { version = "=2.0.0-rc.12", default-features = false, features = [
    "std",
    "ndarray",
    "load-dynamic",
    "tracing",
    "api-23",
], optional = true }
ndarray = { version = "0.17", optional = true }
tracing-appender = "0.2.5"

[features]
default = ["moonshine"]
moonshine = ["dep:ort", "dep:ndarray"]

[profile.release]
# Small, predictable binaries for a presentation machine.
codegen-units = 1
lto = true
strip = true

[profile.dev]
debug = true
