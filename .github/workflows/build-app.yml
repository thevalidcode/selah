# =============================================================================
# Selah Desktop — Production Release Pipeline
# =============================================================================
# Builds and publishes Selah for Windows, macOS (ARM + Intel), and Linux.
# Version source of truth: package.json at the repo root.
#
# Optional code-signing secrets: TAURI_PRIVATE_KEY, TAURI_KEY_PASSWORD
# NOTE: pnpm version is auto-detected from "packageManager" in package.json.
# =============================================================================

name: Release Selah Desktop

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "src-tauri/Cargo.toml"
      - "src-tauri/tauri.conf.json"
      - ".github/workflows/build-app.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.2.3). Leave empty to use package.json."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Version check
  # ---------------------------------------------------------------------------
  check-version:
    name: Check Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: get-version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Check if tag exists
        id: check
        run: |
          if git rev-parse "v${{ steps.get-version.outputs.version }}" >/dev/null 2>&1; then
            echo "Tag v${{ steps.get-version.outputs.version }} already exists — skipping."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Build (matrix: macOS ARM, macOS Intel, Windows, Linux)
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.name }}
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: selah-macos-arm64
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
            artifact: selah-macos-x64
          - name: Windows
            os: windows-latest
            target: ""
            artifact: selah-windows
          - name: Linux
            os: ubuntu-22.04
            target: ""
            artifact: selah-linux
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4

      - name: Locate pnpm store
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ matrix.target }}-

      - run: pnpm install --frozen-lockfile

      - name: Build Tauri app (targeted)
        if: matrix.target != ''
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: Build Tauri app (default target)
        if: matrix.target == ''
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: pnpm tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          # `**` covers both target-specific dirs (macOS) and the default dir (Win/Linux)
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish release
  # ---------------------------------------------------------------------------
  create-release:
    name: Create GitHub Release
    needs: [check-version, build]
    if: |
      always() &&
      needs.check-version.outputs.should_release == 'true' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: v
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Verify required artifacts
        run: |
          set -e
          missing=0
          check() { find release-artifacts -name "$1" | grep -q . || { echo "MISSING: $1"; missing=1; }; }
          check '*.dmg'
          check '*.msi'
          check '*.AppImage'
          check '*.deb'
          [ "$missing" -eq 0 ] || exit 1
          echo "All expected artifacts present."

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.v.outputs.version }}"
          TAG="v${VERSION}"

          mapfile -d '' assets < <(find release-artifacts -type f \( \
            -name "*${VERSION}*.dmg" -o \
            -name "*${VERSION}*.msi" -o \
            -name "*${VERSION}*setup.exe" -o \
            -name "*${VERSION}*.AppImage" -o \
            -name "*${VERSION}*.deb" \
          \) -print0 | sort -z)

          [ ${#assets[@]} -gt 0 ] || { echo "No versioned assets for ${VERSION}"; exit 1; }

          gh release view "$TAG" >/dev/null 2>&1 \
            && gh release edit "$TAG" --title "Selah Desktop v${VERSION}" \
            || gh release create "$TAG" --title "Selah Desktop v${VERSION}" --generate-notes --target "$GITHUB_SHA"

          gh release upload "$TAG" "${assets[@]}" --clobber